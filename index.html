<style>
  :root { --paper: #d3cbba; --ink: #000000; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::selection { background: var(--ink); color: var(--paper); }
  html, body { height: 100%; }
  body {
    font-family: 'VT323', monospace;
    color: var(--ink);
    background-color: var(--paper);
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'8'%20height%3D'8'%3E%3Crect%20width%3D'8'%20height%3D'8'%20fill%3D'%23d3cbba'%2F%3E%3Crect%20x%3D'0'%20y%3D'0'%20width%3D'2'%20height%3D'4'%20fill%3D'%23000000'%2F%3E%3Crect%20x%3D'4'%20y%3D'4'%20width%3D'2'%20height%3D'4'%20fill%3D'%23000000'%2F%3E%3C%2Fsvg%3E");
    background-size: 8px 8px;
  }
  /* ---- menu bar ---- */
  .menubar {
    position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 10;
    background: var(--paper); border-bottom: 2px solid var(--ink);
    display: flex; align-items: center; gap: 18px; padding: 0 12px;
    font-size: 16px; line-height: 1;
  }
  .menubar .spiral { width: 16px; height: 16px; flex: none; }
  .menubar a { color: var(--ink); text-decoration: none; padding: 1px 4px; }
  .menubar a:hover, .menubar a:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
  .menubar .status { margin-left: auto; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .menubar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
  /* ---- desktop / window ---- */
  .desktop { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 44px 16px 24px; }
  .window { width: min(720px, 100%); border: 2px solid var(--ink); background: var(--paper); }
  .titlebar { height: 32px; background: var(--ink); color: var(--paper); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 16px; }
  .titlebar .wsquare { width: 10px; height: 10px; border: 1px solid var(--paper); flex: none; }
  .winbody { border: 1px solid var(--ink); margin: 0; padding: 3px; }
  .pane { border: 2px solid var(--ink); padding: 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #horse-host { width: 100%; overflow: hidden; }
  #horse { font-family: 'VT323', monospace; line-height: 1.0; letter-spacing: 0; white-space: pre; user-select: none; color: var(--ink); }
  .caption { font-size: 16px; text-align: center; }
  @media (max-width: 480px) {
    .menubar { gap: 12px; font-size: 14px; }
    .pane { padding: 14px 10px; }
  }
</style>

(function () {
  var pre = document.getElementById('horse');
  var host = document.getElementById('horse-host');
  var frame = 0;
  pre.textContent = FRAMES[0].join('\n');
  function fit() {
    var w = host.clientWidth;
    if (!w) return;
    var adv = 0.5;
    try {
      var ctx = document.createElement('canvas').getContext('2d');
      ctx.font = "100px 'VT323', monospace";
      var m = ctx.measureText('#').width / 100;
      if (m > 0.1 && m < 1) adv = m;
    } catch (e) {}
    var size = Math.min(15, w / (120 * adv));
    pre.style.fontSize = size + 'px';
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(host);
  else window.addEventListener('resize', fit);
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (!reduced.matches) {
    setInterval(function () {
      frame = (frame + 1) % FRAMES.length;
      pre.textContent = FRAMES[frame].join('\n');
    }, 90);
  }
})();
